name: Hourly Clan Data Sync

on:
  schedule:
    # Hourly, at 17 past rather than on the hour. GitHub drops and delays
    # scheduled runs most at the top of the hour, when everyone's fire; this
    # one was starting only every 4-8 hours. Races no longer depend on it
    # (the races page refreshes them itself), but members, events and goals do.
    - cron: "17 * * * *"

  # Started on time by a Netlify scheduled function (netlify.toml), because
  # GitHub runs the cron above hours late. The cron stays as a backup.
  workflow_dispatch:

# Never run two at once: Netlify and the backup cron can both start one.
concurrency:
  group: hourly-clan-sync
  cancel-in-progress: false

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm ci --force
        
      - name: Run WOM Sync
        run: node scripts/sync-tasks/sync-wom.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}
          WOM_GROUP_ID: ${{ vars.WOM_GROUP_ID || secrets.WOM_GROUP_ID }}
          WOM_VERIFICATION_CODE: ${{ secrets.WOM_VERIFICATION_CODE }}
          
      # Tells the staff channel about members who have earned a rank-up, once
      # per rank (scripts/sync-tasks/rank-up-alerts.cjs). After the WOM sync,
      # so EHB and XP are fresh. Ranks only go up.
      - name: Announce Rank-ups
        id: rank_up_alerts
        run: node scripts/sync-tasks/rank-up-alerts.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_STAFF_CHANNEL_ID: ${{ vars.DISCORD_STAFF_CHANNEL_ID }}

      - name: Run WOM Events Sync
        run: node scripts/sync-tasks/wom-events.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}
          WOM_GROUP_ID: ${{ secrets.WOM_GROUP_ID }}

      # Pays the top Overall XP gainers of any finished week not yet paid
      # (weeks close Monday 19:00 UK). A run with nothing to pay is a no-op.
      # Non-blocking so the steps after it still run; the last step turns a
      # failure here into a failed job, so GitHub emails about it.
      - name: Run Weekly XP Awards
        id: weekly_xp_awards
        run: node scripts/sync-tasks/weekly-xp-awards.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}
          WOM_GROUP_ID: ${{ vars.WOM_GROUP_ID || secrets.WOM_GROUP_ID }}

      # Awards any finished week of weekly titles not yet awarded, then
      # refreshes this week's live title standings for the Leaderboard.
      # About 90 WOM calls, spaced for the API key's limit (roughly a minute).
      - name: Run Weekly Titles
        id: weekly_titles
        run: node scripts/sync-tasks/weekly-titles.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}
          WOM_GROUP_ID: ${{ vars.WOM_GROUP_ID || secrets.WOM_GROUP_ID }}

      # Posts the latest awarded week's title holders to the polls channel,
      # once per week (scripts/sync-tasks/announce-weekly-titles.cjs). Off
      # unless the repository variable TITLES_DISCORD_ENABLED is "true". A
      # Discord failure never touches the awards; it fails this step, and the
      # next run tries again.
      - name: Announce Weekly Titles
        id: announce_titles
        if: vars.TITLES_DISCORD_ENABLED == 'true'
        run: node scripts/sync-tasks/announce-weekly-titles.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_POLLS_CHANNEL_ID: ${{ vars.DISCORD_POLLS_CHANNEL_ID }}

      # After the WOM sync, so player snapshots are as fresh as they get.
      - name: Run Race Progress Sync
        run: node scripts/sync-tasks/race-progress.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}

      # A failed award means Siege Score went unpaid, and a failed announcement
      # means the week is not in Discord. Fail the job (after the other steps
      # have run) so neither is hidden in a green run's log.
      - name: Fail if an award or announcement failed
        if: steps.weekly_xp_awards.outcome == 'failure' || steps.weekly_titles.outcome == 'failure' || steps.announce_titles.outcome == 'failure' || steps.rank_up_alerts.outcome == 'failure'
        run: |
          echo "::error::A weekly step or announcement failed; see the Run Weekly XP Awards / Run Weekly Titles / Announce Weekly Titles / Announce Rank-ups step logs."
          exit 1

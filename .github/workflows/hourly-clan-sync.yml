name: Hourly Clan Data Sync

on:
  schedule:
    # Hourly, at 17 past rather than on the hour. GitHub drops and delays
    # scheduled runs most at the top of the hour, when everyone's fire; this
    # one was starting only every 4-8 hours. Races no longer depend on it
    # (the races page refreshes them itself), but members, events and goals do.
    - cron: "17 * * * *"

  # Started on time by a Netlify scheduled function (netlify.toml), because
  # GitHub runs the cron above hours late. The cron stays as a backup.
  workflow_dispatch:

# Never run two at once: Netlify and the backup cron can both start one.
concurrency:
  group: hourly-clan-sync
  cancel-in-progress: false

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm ci --force
        
      - name: Run WOM Sync
        run: node scripts/sync-tasks/sync-wom.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}
          WOM_GROUP_ID: ${{ vars.WOM_GROUP_ID || secrets.WOM_GROUP_ID }}
          WOM_VERIFICATION_CODE: ${{ secrets.WOM_VERIFICATION_CODE }}
          
      - name: Run WOM Events Sync
        run: node scripts/sync-tasks/wom-events.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}
          WOM_GROUP_ID: ${{ secrets.WOM_GROUP_ID }}

      # Pays last week's top Overall XP gainers once the week closes
      # (Monday 19:00 UK). Every later run that week is a no-op.
      - name: Run Weekly XP Awards
        run: node scripts/sync-tasks/weekly-xp-awards.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}
          WOM_GROUP_ID: ${{ vars.WOM_GROUP_ID || secrets.WOM_GROUP_ID }}

      # After the WOM sync, so player snapshots are as fresh as they get.
      - name: Run Race Progress Sync
        run: node scripts/sync-tasks/race-progress.cjs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WOM_API_KEY: ${{ secrets.WOM_API_KEY }}

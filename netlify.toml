[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"  # Explicitly specify edge functions dir
  
# Scheduled functions start the sync workflows on GitHub, because GitHub's own
# cron runs them hours late (see netlify/functions/utils/githubDispatch.cjs).
# Times are UTC. They run only on the published production deploy.
[functions."scheduled-hourly-sync"]
  schedule = "17 * * * *"

[functions."scheduled-daily-sync"]
  schedule = "43 13 * * *"

# Redirects for client-side routing and API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Automatically map all edge functions in the folder
[[edge_functions]]
  path = "/api/*"
  function = ":splat"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[dev]
  command = "npm start"
  targetPort = 3000
  port = 8888
  framework = "#custom"

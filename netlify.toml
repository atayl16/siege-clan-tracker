[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"  # Explicitly specify edge functions dir
  # Skip the build (exit 0) when nothing the deployed site uses changed since
  # the last build, e.g. a change only to the GitHub sync scripts, workflows,
  # migrations or docs. Saves Netlify build minutes on the free plan.
  # scripts/comp-polls and scripts/sync-tasks/usage-limits.cjs are listed
  # because Netlify functions require them.
  # Anything else that a function or the front end starts to import from
  # outside these paths must be added here, or its changes will not deploy.
  # On a first build CACHED_COMMIT_REF is unset, git diff fails, and the
  # build runs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html vite.config.js package.json package-lock.json netlify.toml .nvmrc deno.lock netlify scripts/comp-polls scripts/sync-tasks/usage-limits.cjs"
  
# Deploy previews (a build for every push to a pull request) cost build
# minutes, so they only run when asked for: put [preview] in the latest
# commit message, e.g.
#   git commit --allow-empty -m "[preview]" && git push
# and push again without it to stop. This replaces the ignore rule above for
# pull requests only; merges to main still build whenever the site changed.
[context.deploy-preview]
  ignore = "! git log -1 --pretty=%B | grep -qF '[preview]'"

# Scheduled functions start the sync workflows on GitHub, because GitHub's own
# cron runs them hours late (see netlify/functions/utils/githubDispatch.cjs).
# Times are UTC. They run only on the published production deploy.
[functions."scheduled-hourly-sync"]
  schedule = "17 * * * *"

[functions."scheduled-daily-sync"]
  schedule = "43 13 * * *"

# Redirects for client-side routing and API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Automatically map all edge functions in the folder
[[edge_functions]]
  path = "/api/*"
  function = ":splat"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[dev]
  command = "npm start"
  targetPort = 3000
  port = 8888
  framework = "#custom"
